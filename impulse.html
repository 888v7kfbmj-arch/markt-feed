<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vertriebsimpulse</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--fg:#17212b;--muted:#5d6975;--line:#d9e1e8;--accent:#17507f;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f161e;--card:#18222d;--fg:#e6edf3;--muted:#98a5b2;--line:#2b3846;--accent:#8fbaf0;--bad:#f08a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px}
h1{margin:0 0 4px;font-size:21px;color:var(--accent);font-weight:600}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--fg)}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--fg);font-size:14px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--card);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#msg{margin:12px 0 0;min-height:1.5em}
#msg.err{color:var(--bad)}
</style></head><body>
<main>
  <h1>Vertriebsimpulse</h1>
  <p>Geschützter Bereich. Bitte das Passwort eingeben.</p>
  <form id="f">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="chk"><input id="merk" type="checkbox"> Auf diesem Gerät angemeldet bleiben</label>
    <button id="go" type="submit">Öffnen</button>
    <p id="msg" role="status"></p>
  </form>
</main>

  var bin = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64 = function (u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var msg = document.getElementById("msg");
  async function auf(raw, k) {
    var mk = await crypto.subtle.importKey("raw", k.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    if (!(await crypto.subtle.verify("HMAC", mk, raw.slice(raw.length - 32), raw.slice(0, raw.length - 32)))) throw new Error("falsch");

  }
  async function oeffnen(ck) {
    var gz = await auf(bin(INHALT), ck);
    var html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  }
  async function ausPasswort(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    var k = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bin(HUELLE.salt), iterations: HUELLE.iter }, base, 512));

  var lesen = function (st) { try { return st.getItem("mnf-ck"); } catch (e) { return null; } };
  var schreiben = function (st, v) { try { st.setItem("mnf-ck", v); } catch (e) { /* kein Speicher */ } };
  var loeschen = function () { try { sessionStorage.removeItem("mnf-ck"); localStorage.removeItem("mnf-ck"); } catch (e) { /* egal */ } };

  if (gemerkt) { msg.textContent = "Wird geöffnet …"; oeffnen(bin(gemerkt)).catch(function () { loeschen(); msg.textContent = ""; }); }

    var go = document.getElementById("go"); go.disabled = true; msg.className = ""; msg.textContent = "Wird geöffnet …";
